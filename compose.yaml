services:
  mysql:
    image: mysql:8.4
    container_name: growdu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-growdu}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-growdu}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-growdu_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-growdu_root_secret}
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
